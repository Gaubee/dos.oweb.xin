# docker-compose.yml
#
# 用法：
#   docker compose pull && docker compose up -d   # 使用 CI 发布的 ghcr 镜像
#   docker compose up -d --build                  # 本地改动后从源码构建
#
# 环境变量通过 .env 文件配置（参考 .env.example）

services:
  admin:
    image: ghcr.io/gaubee/game.oweb.xin:latest
    build: .
    container_name: dos-admin
    ports:
      - "${ADMIN_PORT:-7780}:7780"
    environment:
      ADMIN_ADDR: ":7780"
      # 必填：未设置或为空时 compose 直接报错拒启（:? 校验）
      # 1Panel 部署：.env 与 compose 同目录，如 /opt/1panel/docker/compose/<名称>/.env
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD（管理密码），参考 .env.example}"
      # 可选：HMAC 签名密钥，留空则每次启动随机生成（重启后需重新登录）
      ADMIN_SECRET: "${ADMIN_SECRET:-}"
      DATA_DIR: /app/frontend/public
      ADMIN_DIST: /app/admin/dist
      PUBLISH_HOOK: "${PUBLISH_HOOK:-}"
    volumes:
      # 空挂载（bind mount / 预建卷）由镜像 entrypoint 自愈填充种子数据
      - admin-data:/app/frontend/public
      - frontend-dist:/app/frontend/dist
    restart: unless-stopped

volumes:
  admin-data:
  frontend-dist:
